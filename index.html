<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173d34" />
  <title>MediStock — Medical Stock Management</title>
  <style>
    :root {
      --forest: #173d34;
      --forest-2: #214d42;
      --forest-3: #2d6656;
      --lime: #c9ef78;
      --lime-2: #e5f5c5;
      --ink: #1e2a27;
      --muted: #78847f;
      --muted-2: #9aa49f;
      --line: #e8ece8;
      --paper: #ffffff;
      --canvas: #f4f6f2;
      --red: #d5554c;
      --red-bg: #fff0ee;
      --amber: #bd7d18;
      --amber-bg: #fff6e7;
      --blue: #4477b8;
      --blue-bg: #edf4ff;
      --shadow: 0 8px 30px rgba(26, 52, 43, .055);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Gujarati", sans-serif; font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; }
    .sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 252px; display: flex; flex-direction: column; padding: 25px 16px 18px; color: #eef6f1; background: linear-gradient(180deg, #173d34 0%, #13352d 100%); }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 9px 26px; }
    .brand-mark { width: 39px; height: 39px; display: grid; place-items: center; color: var(--forest); border-radius: 13px; background: var(--lime); box-shadow: 0 4px 16px rgba(201,239,120,.16); }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font-size: 18px; line-height: 1.1; font-weight: 760; letter-spacing: -.55px; }
    .brand-sub { margin-top: 4px; color: #9eb5ab; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .nav-caption { padding: 12px 12px 9px; color: #8eaaa0; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .sidebar nav { display: grid; gap: 5px; }
    .nav-link { min-height: 44px; display: flex; align-items: center; gap: 12px; width: 100%; padding: 0 12px; color: #c5d4cd; text-align: left; border: 0; border-radius: 12px; background: transparent; transition: background .18s, color .18s; }
    .nav-link svg { flex: 0 0 auto; width: 18px; height: 18px; opacity: .8; }
    .nav-link .nav-text { flex: 1; font-size: 13px; font-weight: 540; }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,.07); }
    .nav-link.active { color: #fafff2; background: rgba(255,255,255,.105); box-shadow: inset 3px 0 0 var(--lime); }
    .nav-link.active svg { color: var(--lime); opacity: 1; }
    .nav-badge { min-width: 21px; height: 21px; display: inline-grid; place-items: center; padding: 0 6px; color: #f9fff4; background: rgba(255,255,255,.13); border-radius: 20px; font-size: 10px; font-weight: 750; }
    .nav-badge.alert { color: #4b3210; background: var(--lime); }
    .sidebar-spacer { flex: 1; min-height: 20px; }
    .local-card { margin: 12px 3px 9px; padding: 14px; border: 1px solid rgba(255,255,255,.1); border-radius: 15px; background: rgba(255,255,255,.055); }
    .local-card-top { display: flex; align-items: center; gap: 8px; color: #eaf5ee; font-size: 12px; font-weight: 650; }
    .local-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px rgba(201,239,120,.12); }
    .local-card p { margin: 8px 0 0; color: #a4b9ae; font-size: 11px; line-height: 1.5; }
    .sidebar-foot { padding: 9px 12px 0; color: #78968a; font-size: 10px; }
    .main { min-height: 100vh; margin-left: 252px; }
    .topbar { position: sticky; z-index: 20; top: 0; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 36px; border-bottom: 1px solid rgba(224,231,225,.9); background: rgba(248,249,246,.92); backdrop-filter: blur(16px); }
    .topbar-crumb { display: flex; align-items: center; gap: 8px; color: #87928d; font-size: 12px; }
    .topbar-crumb b { color: #38443f; font-weight: 620; }
    .topbar-actions { display: flex; align-items: center; gap: 9px; }
    .search-box { width: min(245px, 24vw); height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 11px; color: #89938e; border: 1px solid #e3e9e3; border-radius: 11px; background: #fff; }
    .search-box svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .search-box input { width: 100%; min-width: 0; color: var(--ink); border: 0; outline: 0; background: transparent; font-size: 12px; }
    .search-box input::placeholder { color: #a2aaa5; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; padding: 0 14px; color: var(--ink); border: 1px solid #e0e6e0; border-radius: 11px; background: #fff; font-size: 12px; font-weight: 650; white-space: nowrap; transition: .18s ease; }
    .btn:hover { transform: translateY(-1px); border-color: #cad7ce; box-shadow: 0 5px 14px rgba(25,50,40,.06); }
    .btn svg { width: 15px; height: 15px; }
    .btn.primary { color: #162f27; border-color: var(--lime); background: var(--lime); }
    .btn.primary:hover { border-color: #bce366; background: #bce366; }
    .btn.ghost { color: #66736c; background: transparent; border-color: transparent; }
    .btn.danger { color: var(--red); border-color: #f4d8d5; background: #fff; }
    .btn.small { min-height: 32px; padding: 0 10px; border-radius: 9px; font-size: 11px; }
    .btn:disabled { cursor: not-allowed; opacity: .5; transform: none; box-shadow: none; }
    .mobile-menu { display: none; }
    .content { width: min(1500px, 100%); margin: 0 auto; padding: 32px 36px 52px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .eyebrow { margin-bottom: 8px; color: #648477; font-size: 10px; font-weight: 760; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; color: #1b2e27; font-size: clamp(25px, 2.2vw, 32px); line-height: 1.2; letter-spacing: -.9px; font-weight: 720; }
    .page-description { margin: 8px 0 0; color: #7f8b85; font-size: 13px; line-height: 1.55; }
    .page-actions { display: flex; align-items: center; gap: 8px; }
    .page-body { display: grid; gap: 20px; }
    .hero-card { position: relative; min-height: 182px; display: flex; align-items: center; justify-content: space-between; overflow: hidden; padding: 29px 33px; color: #fff; border-radius: 21px; background: linear-gradient(112deg, #1c493d 0%, #25614e 66%, #36735b 100%); box-shadow: 0 13px 30px rgba(23,61,52,.12); }
    .hero-card:after { position: absolute; content: ""; width: 270px; height: 270px; right: 10%; top: -132px; border-radius: 50%; border: 1px solid rgba(223,247,203,.14); box-shadow: 0 0 0 28px rgba(223,247,203,.035), 0 0 0 58px rgba(223,247,203,.025); }
    .hero-copy { position: relative; z-index: 1; max-width: 620px; }
    .hero-kicker { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; color: #e1f1d6; border: 1px solid rgba(255,255,255,.14); border-radius: 20px; background: rgba(255,255,255,.08); font-size: 9px; letter-spacing: .11em; font-weight: 750; }
    .hero-kicker span { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
    .hero-copy h2 { margin: 14px 0 7px; color: #fff; font-size: clamp(20px, 2.1vw, 27px); line-height: 1.25; letter-spacing: -.5px; font-weight: 690; }
    .hero-copy p { max-width: 515px; margin: 0; color: #c3d9cc; font-size: 12px; line-height: 1.6; }
    .hero-actions { display: flex; gap: 8px; margin-top: 17px; }
    .hero-actions .btn { min-height: 35px; font-size: 11px; }
    .hero-actions .btn:not(.primary) { color: #eff7f0; border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.08); }
    .hero-art { position: relative; z-index: 1; width: 158px; height: 145px; margin-right: 9%; display: grid; place-items: center; }
    .hero-pill { width: 82px; height: 32px; position: absolute; border: 5px solid rgba(255,255,255,.9); border-radius: 22px; background: linear-gradient(90deg, #d7f7aa 50%, #fff 50%); box-shadow: 0 12px 30px rgba(0,0,0,.14); transform: rotate(-36deg); }
    .hero-pill:before { position: absolute; content: ""; left: 50%; top: 0; height: 100%; border-left: 2px solid rgba(59,100,66,.24); }
    .hero-cross { position: absolute; width: 44px; height: 44px; right: 2px; top: 13px; display: grid; place-items: center; color: #e9f6dc; font-size: 42px; line-height: 1; font-weight: 200; opacity: .85; transform: rotate(12deg); }
    .hero-orb { position: absolute; width: 22px; height: 22px; left: 16px; bottom: 14px; border-radius: 50%; background: #c9ef78; box-shadow: 0 0 0 9px rgba(201,239,120,.11); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .stat-card { position: relative; overflow: hidden; min-height: 124px; padding: 18px 18px 16px; border: 1px solid #edf0eb; border-radius: 16px; background: #fff; box-shadow: 0 4px 16px rgba(26,52,43,.025); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stat-label { color: #78847e; font-size: 11px; font-weight: 600; }
    .stat-icon { width: 34px; height: 34px; display: grid; place-items: center; color: var(--forest-2); border-radius: 11px; background: #edf5e7; }
    .stat-icon svg { width: 17px; height: 17px; }
    .stat-icon.amber { color: #a96c12; background: var(--amber-bg); }
    .stat-icon.red { color: #c44b43; background: var(--red-bg); }
    .stat-value { margin-top: 9px; color: #1d3129; font-size: 27px; line-height: 1; font-weight: 740; letter-spacing: -.8px; }
    .stat-note { margin-top: 7px; color: #9aa49f; font-size: 10px; }
    .dashboard-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; align-items: start; }
    .panel { min-width: 0; border: 1px solid #e9ede8; border-radius: 17px; background: #fff; box-shadow: 0 4px 18px rgba(26,52,43,.025); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 15px; border-bottom: 1px solid #eff2ee; }
    .panel-head h3 { margin: 0; color: #273831; font-size: 14px; font-weight: 690; letter-spacing: -.15px; }
    .panel-head p { margin: 5px 0 0; color: #98a19c; font-size: 10px; }
    .panel-link { padding: 5px 0; color: #466f5c; border: 0; background: transparent; font-size: 11px; font-weight: 700; }
    .panel-link:hover { color: var(--forest); }
    .mini-list { display: grid; }
    .mini-row { display: flex; align-items: center; gap: 11px; padding: 13px 20px; border-bottom: 1px solid #f1f3f0; }
    .mini-row:last-child { border-bottom: 0; }
    .mini-avatar { flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center; color: #4f765f; border-radius: 11px; background: #eef5e9; font-size: 13px; font-weight: 720; text-transform: uppercase; }
    .mini-main { flex: 1; min-width: 0; }
    .mini-main strong { display: block; overflow: hidden; color: #33423b; font-size: 11px; font-weight: 660; text-overflow: ellipsis; white-space: nowrap; }
    .mini-main span { display: block; margin-top: 4px; color: #9aa49f; font-size: 10px; }
    .mini-value { color: #40534a; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; gap: 5px; width: fit-content; padding: 5px 8px; color: #54745e; border-radius: 30px; background: #eef6e9; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .status.warn { color: #a97018; background: var(--amber-bg); }
    .status.danger { color: #bf4b43; background: var(--red-bg); }
    .status.neutral { color: #687771; background: #f0f3f1; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .activity-list { display: grid; padding: 2px 20px 9px; }
    .activity-item { display: flex; gap: 11px; padding: 12px 0; border-bottom: 1px solid #f0f2ef; }
    .activity-item:last-child { border-bottom: 0; }
    .activity-icon { width: 31px; height: 31px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; }
    .activity-icon svg { width: 15px; height: 15px; }
    .activity-icon.in { color: #477451; background: #edf6e8; }
    .activity-icon.out { color: #b87526; background: #fff4e6; }
    .activity-copy { flex: 1; min-width: 0; }
    .activity-copy strong { display: block; color: #3c4a43; font-size: 11px; font-weight: 640; line-height: 1.45; }
    .activity-copy span { display: block; margin-top: 4px; color: #a0a9a3; font-size: 10px; }
    .activity-qty { align-self: center; color: #44564d; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .quick-actions { display: grid; grid-template-columns: repeat(3,1fr); gap: 11px; }
    .quick-card { min-height: 84px; display: flex; align-items: center; gap: 12px; padding: 15px; border: 1px solid #e9ede8; border-radius: 15px; background: #fff; text-align: left; transition: .18s; }
    .quick-card:hover { transform: translateY(-2px); border-color: #cfdfd2; box-shadow: var(--shadow); }
    .quick-ico { width: 35px; height: 35px; flex: 0 0 auto; display: grid; place-items: center; color: #315948; border-radius: 11px; background: #edf5e7; }
    .quick-ico svg { width: 17px; height: 17px; }
    .quick-card strong { display: block; color: #34473d; font-size: 11px; font-weight: 700; }
    .quick-card span { display: block; margin-top: 4px; color: #98a39c; font-size: 10px; }
    .section-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 5px 0 12px; }
    .section-title-row h3 { margin: 0; color: #33433a; font-size: 14px; font-weight: 680; }
    .section-title-row span { color: #9aa49f; font-size: 10px; }
    .table-card { overflow: hidden; border: 1px solid #e7ece7; border-radius: 17px; background: #fff; box-shadow: 0 4px 18px rgba(26,52,43,.025); }
    .table-toolbar { min-height: 55px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-bottom: 1px solid #edf0ed; }
    .table-toolbar-title { display: flex; align-items: center; gap: 8px; color: #34453c; font-size: 12px; font-weight: 690; }
    .count-pill { display: inline-grid; min-width: 22px; height: 22px; place-items: center; padding: 0 6px; color: #557360; border-radius: 20px; background: #eef5e9; font-size: 10px; font-weight: 750; }
    .table-hint { color: #98a39c; font-size: 10px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    thead th { padding: 12px 15px; color: #8a9790; background: #fafbf9; border-bottom: 1px solid #edf0ed; font-size: 10px; font-weight: 700; letter-spacing: .01em; }
    tbody td { padding: 13px 15px; color: #536058; border-bottom: 1px solid #f0f2ef; font-size: 11px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fcfdfb; }
    .cell-primary { color: #2d3d34; font-size: 11px; font-weight: 680; }
    .cell-sub { margin-top: 4px; color: #9ca69f; font-size: 10px; }
    .num-cell { color: #2e4839; font-size: 12px; font-weight: 730; }
    .muted-cell { color: #9ca69f; }
    .row-actions { display: flex; align-items: center; gap: 5px; }
    .icon-btn { width: 29px; height: 29px; display: grid; place-items: center; color: #77857d; border: 1px solid transparent; border-radius: 8px; background: transparent; }
    .icon-btn:hover { color: #315a47; border-color: #e1e9df; background: #f5f8f3; }
    .icon-btn.delete:hover { color: var(--red); border-color: #f4dad7; background: #fff6f5; }
    .icon-btn svg { width: 14px; height: 14px; }
    .empty-state { display: grid; justify-items: center; padding: 49px 20px 54px; text-align: center; }
    .empty-art { width: 54px; height: 54px; display: grid; place-items: center; color: #54806b; border: 1px solid #e2eadf; border-radius: 17px; background: #f0f6e9; }
    .empty-art svg { width: 23px; height: 23px; }
    .empty-state h3 { margin: 14px 0 5px; color: #35463d; font-size: 14px; font-weight: 700; }
    .empty-state p { max-width: 380px; margin: 0 0 16px; color: #98a39c; font-size: 11px; line-height: 1.65; }
    .alert-banner { display: flex; align-items: flex-start; gap: 11px; padding: 14px 16px; color: #6a4b19; border: 1px solid #f2dfbb; border-radius: 13px; background: #fff9ec; font-size: 11px; line-height: 1.55; }
    .alert-banner svg { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 1px; }
    .alert-setting { display: flex; align-items: center; gap: 8px; color: #75817a; font-size: 11px; }
    .alert-setting input { width: 64px; height: 34px; padding: 0 8px; color: #30443a; border: 1px solid #e2e8e1; border-radius: 9px; outline: 0; background: #fff; }
    .alert-setting input:focus { border-color: #9fc090; box-shadow: 0 0 0 3px #eff6e9; }
    .alert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .alert-item { display: flex; align-items: center; gap: 11px; padding: 14px 17px; border-bottom: 1px solid #f0f2ef; }
    .alert-item:last-child { border-bottom: 0; }
    .alert-symbol { flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; }
    .alert-symbol svg { width: 16px; height: 16px; }
    .alert-symbol.red { color: #c24d45; background: #fff0ee; }
    .alert-symbol.amber { color: #ac741d; background: #fff6e7; }
    .alert-main { flex: 1; min-width: 0; }
    .alert-main strong { display: block; color: #394840; font-size: 11px; font-weight: 680; overflow: hidden; text-overflow: ellipsis; }
    .alert-main span { display: block; margin-top: 4px; color: #98a39c; font-size: 10px; }
    .alert-value { text-align: right; color: #3e5247; font-size: 11px; font-weight: 730; white-space: nowrap; }
    .alert-value small { display: block; margin-top: 4px; color: #98a39c; font-size: 9px; font-weight: 500; }
    .patient-name-cell { display: flex; align-items: center; gap: 9px; }
    .patient-avatar { width: 30px; height: 30px; display: grid; place-items: center; color: #577c68; border-radius: 10px; background: #edf5e8; font-size: 10px; font-weight: 750; }
    .sheet-notice { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 16px; padding: 12px 14px; color: #587165; border: 1px solid #e3eadf; border-radius: 12px; background: #f9fcf6; font-size: 10px; line-height: 1.55; }
    .sheet-notice svg { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 1px; color: #4d765f; }
    .toast { position: fixed; z-index: 100; right: 25px; bottom: 24px; max-width: min(430px, calc(100vw - 34px)); display: flex; align-items: flex-start; gap: 10px; padding: 13px 16px; color: #f7fff9; border: 1px solid rgba(255,255,255,.12); border-radius: 13px; background: #204b3e; box-shadow: 0 12px 36px rgba(19,49,39,.22); font-size: 12px; line-height: 1.5; opacity: 0; pointer-events: none; transform: translateY(10px); transition: .22s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #8b3e38; }
    .toast svg { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px; color: var(--lime); }
    .modal-backdrop { position: fixed; z-index: 80; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(14,29,24,.48); backdrop-filter: blur(4px); animation: fade-in .14s ease-out; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .modal { width: min(600px, 100%); max-height: min(90vh, 800px); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,.7); border-radius: 20px; background: #fff; box-shadow: 0 25px 70px rgba(12,31,23,.22); animation: rise-in .18s ease-out; }
    .modal.wide { width: min(760px, 100%); }
    @keyframes rise-in { from { opacity: .7; transform: translateY(7px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 21px 23px 15px; border-bottom: 1px solid #edf0ed; }
    .modal-head h2 { margin: 0; color: #263a30; font-size: 18px; letter-spacing: -.3px; }
    .modal-head p { margin: 6px 0 0; color: #929c96; font-size: 11px; line-height: 1.5; }
    .modal-close { width: 30px; height: 30px; display: grid; place-items: center; color: #87938c; border: 0; border-radius: 9px; background: #f4f6f3; }
    .modal-close svg { width: 15px; height: 15px; }
    .modal-body { overflow: auto; padding: 19px 23px 2px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 13px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: flex; align-items: center; gap: 5px; color: #55645b; font-size: 11px; font-weight: 650; }
    .field label .req { color: #d15c50; }
    .field label small { color: #a3aca6; font-size: 9px; font-weight: 500; }
    .field input, .field select, .field textarea { width: 100%; min-height: 39px; padding: 9px 11px; color: #34473c; border: 1px solid #e1e8e1; border-radius: 10px; outline: 0; background: #fff; font-size: 12px; transition: .16s; }
    .field textarea { min-height: 76px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: #b4bcb6; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #9fc091; box-shadow: 0 0 0 3px #eff6e9; }

</head>
<body>

          <label class="search-box" aria-label="Search this page"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="globalSearch" type="search" placeholder="આ પેજમાં શોધો..." autocomplete="off" /></label>
          <button class="btn" id="importBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5M4 14.5v4A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Import Excel</span></button>
          <button class="btn" id="templateBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l5 5v12H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3.5v5h5M8.5 13h7M8.5 16.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Template</span></button>
          <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v13m0 0 4.5-4.5M12 16l-4.5-4.5M4 16v3.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Export Excel</span></button>

  <div class="toast" id="toast" role="status"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.2 4.2L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="toastMessage"></span></div>
  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'medistock_browser_data_v1';
    const PAGE = {
      dashboard: { title: 'Overview', gu: 'ઝાંખી', desc: 'તમારા medical stock, alerts અને તાજેતરની activity એક જ જગ્યાએ જુઓ.', eyebrow: 'MEDICAL INVENTORY' },
      products: { title: 'Product Master', gu: 'પ્રોડક્ટ માસ્ટર', desc: 'દવાઓ અને medical productsની master વિગતો સંચાલિત કરો.', eyebrow: 'CATALOGUE' },
      stockIn: { title: 'Stock Entry', gu: 'સ્ટોક એન્ટ્રી', desc: 'નવો stock batch ઉમેરો. દરેક entryમાં expiry અને બાકી જથ્થો track થશે.', eyebrow: 'INWARD INVENTORY' },
      stockOut: { title: 'Stock Out', gu: 'સ્ટોક આઉટ', desc: 'દર્દીને stock આપો અને batch પ્રમાણે ઉપલબ્ધ જથ્થો update કરો.', eyebrow: 'ISSUE / DISPENSE' },
      patients: { title: 'Patient Master', gu: 'પેશન્ટ માસ્ટર', desc: 'દર્દીઓની વિગતો સાચવો અને stock issue સમયે પસંદ કરો.', eyebrow: 'PATIENT DIRECTORY' },
      alerts: { title: 'Alerts', gu: 'ચેતવણીઓ', desc: 'Low-stock અને expiry નજીક હોય તેવા batches પર નજર રાખો.', eyebrow: 'ATTENTION NEEDED' }
    };
    let state = loadState();
    let activePage = 'dashboard';
    let toastTimer;
    let pendingImport = null;

    const PATIENT_SEED_KEY = 'medistock_initial_patient_names_v1';
    const INITIAL_PATIENT_NAMES = [
      'P.Gunnidhiswami','P.Sarvopariswami','P.Mangalmurtiswami','P.Vinamraswami','P.Rajeshwarswami',
      'P.Sarvamangalswami','P.Haripriyaswami','P.Swayamprakashswami','P.Nimagnswami','P.Hariprakashswami',
      'P.Haridarshanswami','P.Shvetdarshanswami','P.Haribhushanswami','Jigar Maharaj','Ketu Maharaj',
      'Ketul Maharaj','Chintan Maharaj','Sahdev Maharaj','Sagar Maharaj','Sahaj Maharaj (1)',
      'Khush Maharaj','Ghanshyam Maharaj','Darshan Maharaj','Sahaj Maharaj (2)','Abhishek Maharaj',
      'Tejas Maharaj','Dixit Maharaj','Savan Maharaj','Jaydeep Maharaj','Parthiv Maharaj',
      'Ghanshyam Maharaj (2)','Chandrakantbhai'
    ];
    function emptyState() { return { products: [], patients: [], stockEntries: [], stockOuts: [], preferences: { expiryDays: 30 } }; }
    function seedRequestedPatients(s) {
      try {
        if (localStorage.getItem(PATIENT_SEED_KEY) === 'done') return s;
        const known = new Set((s.patients || []).map(p => String(p.name || '').trim().toLowerCase()));
        INITIAL_PATIENT_NAMES.forEach(name => {
          if (!known.has(name.toLowerCase())) s.patients.push({ id: uid(), name, patientId: '', phone: '', age: '', gender: '', notes: '' });
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        localStorage.setItem(PATIENT_SEED_KEY, 'done');
      } catch (_) { /* Keep seeded names in memory if browser storage is unavailable. */ }
      return s;
    }
    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (!parsed || !Array.isArray(parsed.products)) return seedRequestedPatients(emptyState());
        const loaded = { ...emptyState(), ...parsed, preferences: { expiryDays: 30, ...(parsed.preferences || {}) }, patients: Array.isArray(parsed.patients) ? parsed.patients : [], stockEntries: Array.isArray(parsed.stockEntries) ? parsed.stockEntries : [], stockOuts: Array.isArray(parsed.stockOuts) ? parsed.stockOuts : [] };
        return seedRequestedPatients(loaded);
      } catch (_) { return seedRequestedPatients(emptyState()); }
    }
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (e) { showToast('ડેટા save થઈ શક્યો નથી. Browser storage ખાલી કરો અથવા Excel backup લો.', true); }
    }
    function uid() { return (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'ms-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9); }
    function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch])); }
    function icon(name) {
      const paths = {
        box: '<path d="m12 3 8.5 4.5v9L12 21l-8.5-4.5v-9L12 3Z"/><path d="m3.8 7.7 8.2 4.5 8.2-4.5M12 12.2V21"/>',
        pills: '<path d="M9.2 3.5a3.5 3.5 0 0 1 4.95 0l6.35 6.35a3.5 3.5 0 0 1 0 4.95l-2.12 2.12a3.5 3.5 0 0 1-4.95 0l-6.35-6.35a3.5 3.5 0 0 1 0-4.95L9.2 3.5Z"/><path d="m8.4 7.1 8.4 8.4"/>',
        people: '<path d="M16 20v-1.7a3.3 3.3 0 0 0-3.3-3.3H7.3A3.3 3.3 0 0 0 4 18.3V20m6-8a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm9-1v6m-3-3h6"/>',
        warning: '<path d="M10.3 4.7 2.8 18a1.6 1.6 0 0 0 1.4 2.4h15.6a1.6 1.6 0 0 0 1.4-2.4L13.7 4.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3h.01"/>',
        calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17"/>',
        up: '<path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5M4 14.5v4A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-4"/>',
        down: '<path d="M12 8v13m0 0-4.5-4.5M12 21l4.5-4.5M4 9.5v-4A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v4"/>',
        edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5Z"/>',
        trash: '<path d="M3.5 6h17M9 6V4h6v2m3 0-.8 14H6.8L6 6m4 4v6m4-6v6"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        close: '<path d="m6 6 12 12M18 6 6 18"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
        arrow: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
        check: '<path d="m5 12.5 4.2 4.2L19 7"/>',
        file: '<path d="M7 3.5h7l5 5v12H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"/><path d="M14 3.5v5h5M8.5 13h7M8.5 16.5h7"/>',
        search: '<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/>',
        info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
        bell: '<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>',
        activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
        menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
      };
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.info}</svg>`;
    }
    function showToast(message, error = false) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.toggle('error', error);
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }
    function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function dateDisplay(value) {
      if (!value) return '—';
      const d = new Date(String(value).slice(0,10) + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return esc(value);
      return new Intl.DateTimeFormat('en-IN', { day:'2-digit', month:'short', year:'numeric' }).format(d);
    }
    function daysUntil(dateValue) {
      if (!dateValue) return null;
      const a = new Date(todayISO() + 'T00:00:00');
      const b = new Date(String(dateValue).slice(0,10) + 'T00:00:00');
      if (Number.isNaN(b.getTime())) return null;
      return Math.round((b - a) / 86400000);
    }
    function fmtQty(value) { return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(Number(value) || 0); }
    function productById(id) { return state.products.find(p => p.id === id); }
    function patientById(id) { return state.patients.find(p => p.id === id); }
    function productLabel(p) { return [p?.contentName, p?.brandName].filter(Boolean).join(' · ') || 'Unnamed product'; }
    function productKey(p) { return [p.contentName, p.brandName, p.packing].map(x => String(x || '').trim().toLowerCase()).join('|'); }
    function lotBalance(entry, source = state) {
      const issued = source.stockOuts.filter(o => o.lotId === entry.id).reduce((sum, o) => sum + (Number(o.qty) || 0), 0);
      return Math.max(0, (Number(entry.qty) || 0) - issued);
    }
    function productStock(productId, source = state) {
      return source.stockEntries.filter(e => e.productId === productId).reduce((sum, e) => sum + lotBalance(e, source), 0);
    }
    function usableLots(productId, source = state) {
      return source.stockEntries.filter(e => e.productId === productId && lotBalance(e, source) > 0 && (!e.expiryDate || e.expiryDate >= todayISO()))
        .sort((a,b) => (a.expiryDate || '9999-12-31').localeCompare(b.expiryDate || '9999-12-31') || String(a.date || '').localeCompare(String(b.date || '')));
    }
    function usableProductStock(productId, source = state) {
      return source.stockEntries.filter(e => e.productId === productId && (!e.expiryDate || e.expiryDate >= todayISO())).reduce((sum,e) => sum + lotBalance(e,source),0);
    }
    function lowStockProducts(source = state) {
      return source.products.filter(p => usableProductStock(p.id, source) <= Math.max(0, Number(p.demand) || 0));
    }
    function expiringLots(source = state) {
      const windowDays = Math.max(0, Number(source.preferences?.expiryDays) || 0);
      return source.stockEntries.map(e => ({ entry:e, product:source.products.find(p => p.id === e.productId), qty:lotBalance(e, source), days:daysUntil(e.expiryDate) }))
        .filter(x => x.product && x.qty > 0 && x.entry.expiryDate && x.days !== null && x.days <= windowDays)
        .sort((a,b) => a.days - b.days);
    }
    function totalUnits(source = state) { return source.products.reduce((sum,p) => sum + usableProductStock(p.id,source), 0); }
    function updateSidebar() {
      document.querySelectorAll('.nav-link').forEach(btn => btn.classList.toggle('active', btn.dataset.page === activePage));
      const badge = document.getElementById('alertBadge');
      const count = lowStockProducts().length + expiringLots().length;
      badge.textContent = count > 99 ? '99+' : count;
      badge.classList.toggle('alert', count > 0);
      badge.style.display = count ? 'inline-grid' : '';
    }
    function setPage(page) {

    function setPageHeader(actionHtml = '') {

      document.getElementById('pageDescription').textContent = p.desc;
      document.getElementById('pageActions').innerHTML = actionHtml;
    }
    function currentSearch() { return document.getElementById('globalSearch').value.trim().toLowerCase(); }
    function matchesSearch(values) { const q = currentSearch(); return !q || values.filter(v => v != null).join(' ').toLowerCase().includes(q); }
    function tableCard(title, count, headers, rows, hint = '') {
      return `<section class="table-card"><div class="table-toolbar"><div class="table-toolbar-title">${esc(title)} <span class="count-pill">${count}</span></div><div class="table-hint">${esc(hint || 'ડેટા આપમેળે save થાય છે')}</div></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>${count ? '' : `<div class="empty-state"><div class="empty-art">${icon('box')}</div><h3>હજુ કોઈ record નથી</h3><p>શરૂઆત કરવા માટે ઉપરનું action button વાપરો, અથવા Excel workbook import કરો.</p></div>`}</section>`;
    }
    function emptyPanel(title, text, action, iconName='box') {
      return `<div class="empty-state"><div class="empty-art">${icon(iconName)}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>${action || ''}</div>`;
    }
    function actionButton(label, action, primary = true, iconName = 'plus') {
      return `<button class="btn ${primary ? 'primary' : ''}" data-action="${esc(action)}">${icon(iconName)}<span>${esc(label)}</span></button>`;
    }
    function render() {
      updateSidebar();

      if (activePage === 'alerts') action = `<label class="alert-setting">Expiry window <input id="expiryDaysInput" type="number" min="0" max="365" value="${esc(state.preferences.expiryDays)}" aria-label="Expiry alert window in days" /> days</label>`;
      setPageHeader(action);

      body.innerHTML = activePage === 'dashboard' ? renderDashboard() : activePage === 'products' ? renderProducts() : activePage === 'stockIn' ? renderStockIn() : activePage === 'stockOut' ? renderStockOut() : activePage === 'patients' ? renderPatients() : renderAlerts();
    }

        ...state.stockOuts.map(o => ({ kind:'out', date:o.createdAt || o.date || '', qty:o.qty, product:productById(o.productId), patient:patientById(o.patientId), sub:`Stock OUT · ${patientById(o.patientId)?.name || 'Patient'}` }))

          <div class="stat-card"><div class="stat-top"><span class="stat-label">ઉપલબ્ધ units</span><span class="stat-icon">${icon('box')}</span></div><div class="stat-value">${fmtQty(stockCount)}</div><div class="stat-note">non-expired batchesનો બાકી stock</div></div>

        </section>
        <section><div class="section-title-row"><h3>ઝડપી કામ</h3><span>એક ક્લિકમાં entry કરો</span></div><div class="quick-actions"><button class="quick-card" data-action="add-product"><span class="quick-ico">${icon('plus')}</span><span><strong>Product ઉમેરો</strong><span>નવી દવા નોંધો</span></span></button><button class="quick-card" data-action="add-stock-in"><span class="quick-ico">${icon('up')}</span><span><strong>Stock IN</strong><span>નવો batch દાખલ કરો</span></span></button><button class="quick-card" data-action="add-stock-out"><span class="quick-ico">${icon('down')}</span><span><strong>Stock OUT</strong><span>Patientને issue કરો</span></span></button></div></section>

    }
    function renderProducts() {
      const rows = state.products.filter(p => matchesSearch([p.contentName,p.brandName,p.packing,p.uses,p.category,p.demand])).sort((a,b)=>String(a.contentName).localeCompare(String(b.contentName))).map(p => `<tr><td><span class="cell-primary">${esc(p.contentName)}</span></td><td>${esc(p.brandName || '—')}</td><td>${esc(p.packing || '—')}</td><td>${esc(p.uses || '—')}</td><td>${p.demand === '' || p.demand == null ? '—' : fmtQty(p.demand)}</td><td>${esc(p.category || '—')}</td><td><div class="row-actions"><button class="icon-btn" data-action="edit-product" data-id="${esc(p.id)}" title="Edit">${icon('edit')}</button><button class="icon-btn delete" data-action="delete-product" data-id="${esc(p.id)}" title="Delete">${icon('trash')}</button></div></td></tr>`);

        const p=productById(e.productId), balance=lotBalance(e), days=daysUntil(e.expiryDate);

        return `<tr><td><span class="cell-primary">${esc(p.contentName)}</span></td><td>${esc(p.brandName || '—')}</td><td>${esc(p.packing || '—')}</td><td><span class="num-cell">${fmtQty(balance)}</span></td><td><span class="num-cell">${fmtQty(e.qty)}</span></td><td>${expiryBadge}</td><td>${esc(p.uses || '—')}</td><td>${esc(p.category || '—')}</td><td>${dateDisplay(e.date || e.createdAt)}</td><td><div class="row-actions"><button class="icon-btn delete" data-action="delete-entry" data-id="${esc(e.id)}" title="Delete entry">${icon('trash')}</button></div></td></tr>`;
      });
      const content = rows.length ? tableCard('Stock Entry batches', rows.length, ['Content Name','Brand Name','Packing','Current Stock','Stock IN','Expiry Date','Uses','usage category','Entry Date','Actions'], rows, 'Current Stock = batch balance after issues') : emptyPanel(entries.length ? 'Searchમાં કોઈ batch નથી' : 'હજુ stock entry નથી', entries.length ? 'Search શબ્દ બદલો અથવા સાફ કરો.' : state.products.length ? 'Stock IN ઉમેરો. Expiry date batch મુજબ સાચવાશે.' : 'પહેલા Product Masterમાં ઓછામાં ઓછો એક product ઉમેરો.', entries.length ? '' : actionButton(state.products.length ? 'Add Stock IN' : 'Add Product',state.products.length ? 'add-stock-in' : 'add-product'), 'up');

    function renderPatients() {
      const patients = state.patients.filter(p=>matchesSearch([p.name,p.patientId,p.phone,p.age,p.gender,p.notes])).sort((a,b)=>String(a.name).localeCompare(String(b.name)));

    function renderAlerts() {
      const low = lowStockProducts().filter(p=>matchesSearch([p.contentName,p.brandName,p.packing,p.uses,p.category,usableProductStock(p.id),p.demand]));
      const exp = expiringLots().filter(x=>matchesSearch([x.product.contentName,x.product.brandName,x.product.packing,x.entry.expiryDate,x.qty,x.days]));
      const lowRows = low.map(p=>`<div class="alert-item"><div class="alert-symbol red">${icon('warning')}</div><div class="alert-main"><strong>${esc(p.contentName)} · ${esc(p.brandName || 'Brand not set')}</strong><span>${esc(p.packing || '')}${p.uses ? ' · '+esc(p.uses) : ''}</span></div><div class="alert-value">${fmtQty(usableProductStock(p.id))} / ${fmtQty(p.demand)}<small>Usable / Demand</small></div></div>`).join('');
      const expRows = exp.map(x=>`<div class="alert-item"><div class="alert-symbol ${x.days < 0 ? 'red':'amber'}">${icon('calendar')}</div><div class="alert-main"><strong>${esc(x.product.contentName)} · ${esc(x.product.brandName || 'Brand not set')}</strong><span>${esc(x.product.packing || '')} · ${fmtQty(x.qty)} units · Expiry ${dateDisplay(x.entry.expiryDate)}</span></div><div class="alert-value">${x.days < 0 ? 'Expired' : x.days === 0 ? 'Today' : `${x.days} days`}<small>${x.days < 0 ? 'Do not dispense' : 'Expiry countdown'}</small></div></div>`).join('');

      const body = `<div class="form-grid"><div class="field full"><label for="outProduct">Product <span class="req">*</span></label><select id="outProduct" name="productId" required><option value="">Product પસંદ કરો</option>${productOptions(eligible)}</select></div><div class="field full"><label for="outLot">Expiry batch <span class="req">*</span></label><select id="outLot" name="lotId" required><option value="">પહેલા product પસંદ કરો</option></select><span class="field-hint" id="outAvailableHint">Batch પસંદ કર્યા પછી ઉપલબ્ધ જથ્થો દેખાશે.</span></div>${field('Stock OUT','qty','',{type:'number',required:true,min:0.01,step:'any',placeholder:'જથ્થો',id:'outQty'})}<div class="field"><label for="outPatient">Patient <span class="req">*</span></label><select id="outPatient" name="patientId" required><option value="">Patient પસંદ કરો</option>${state.patients.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.patientId?' · '+esc(p.patientId):''}</option>`).join('')}</select></div>${field('Date','date',todayISO(),{type:'date',required:true})}<div class="field full"><label>Product details</label><div class="readout" id="outReadout">Product પસંદ કર્યા પછી details અહીં દેખાશે.</div></div></div>`;
      openModal({title:'Add Stock OUT',subtitle:'Patientને દવા issue કરો. Expiry મુજબ યોગ્ય batch પસંદ કરો.',body,submitLabel:'Save Stock OUT',note:'Expired batchમાંથી issue અટકાવવામાં આવે છે.',formType:'stock-out'});

    function populateOutLots(productId) {

      if (lots.length) { sel.selectedIndex=0; hint.textContent='સૌથી વહેલી expiry પહેલાંથી પસંદ છે (FEFO). જરૂર મુજબ બદલો.'; }
      else hint.textContent='આ productનો usable stock ઉપલબ્ધ નથી.';

    function updateOutAvailability() {

    }
    function addProduct(source, data) {
      const key=productKey(data);
      let p=source.products.find(x=>productKey(x)===key);
      if (p) { Object.assign(p,data); return p; }
      p={id:uid(), ...data}; source.products.push(p); return p;
    }
    function addPatient(source, data) {
      const pid=String(data.patientId || '').trim().toLowerCase();
      const key=pid ? `id:${pid}` : `name:${String(data.name||'').trim().toLowerCase()}|${String(data.phone||'').trim()}`;
      let p=source.patients.find(x => (String(x.patientId||'').trim().toLowerCase() ? `id:${String(x.patientId).trim().toLowerCase()}` : `name:${String(x.name||'').trim().toLowerCase()}|${String(x.phone||'').trim()}`) === key);
      if (p) { Object.assign(p,data); return p; }
      p={id:uid(),...data}; source.patients.push(p); return p;
    }
    function onFormSubmit(event) {
      const form=event.target.closest('#modalForm');
      if (!form) return;
      event.preventDefault();
      if (!form.reportValidity()) return;
      const type=form.dataset.formType, fd=new FormData(form), data=Object.fromEntries(fd.entries());
      if (type==='redirect-product') { closeModal(); openProductModal(); return; }
      if (type==='redirect-patient') { closeModal(); openPatientModal(); return; }
      if (type==='redirect-stock-in') { closeModal(); openStockInModal(); return; }
      if (type==='new-product' || type==='edit-product') {
        const product={contentName:String(data.contentName||'').trim(),brandName:String(data.brandName||'').trim(),packing:String(data.packing||'').trim(),uses:String(data.uses||'').trim(),demand:data.demand===''?'':Number(data.demand),category:String(data.category||'').trim()};
        if (type==='edit-product') { const p=productById(form.dataset.id); if (p) Object.assign(p,product); }
        else { if (state.products.some(p=>productKey(p)===productKey(product))) { showToast('આ product (Content, Brand અને Packing) પહેલેથી નોંધાયેલ છે.',true); return; } state.products.push({id:uid(),...product}); }
        saveState(); closeModal(); render(); showToast(type==='edit-product'?'Productની વિગતો update થઈ.':'Product ઉમેરાયો.'); return;
      }
      if (type==='new-patient' || type==='edit-patient') {
        const patient={name:String(data.name||'').trim(),patientId:String(data.patientId||'').trim(),phone:String(data.phone||'').trim(),age:data.age===''?'':Number(data.age),gender:String(data.gender||'').trim(),notes:String(data.notes||'').trim()};
        if (type==='edit-patient') { const p=patientById(form.dataset.id); if (p) Object.assign(p,patient); }
        else { state.patients.push({id:uid(),...patient}); }
        saveState(); closeModal(); render(); showToast(type==='edit-patient'?'Patientની વિગતો update થઈ.':'Patient ઉમેરાયો.'); return;
      }
      if (type==='stock-in') {
        const p=productById(data.productId), qty=Number(data.qty);
        if (!p || !(qty>0)) { showToast('Product અને યોગ્ય quantity પસંદ કરો.',true); return; }
        state.stockEntries.push({id:uid(),productId:p.id,qty,expiryDate:data.expiryDate,date:data.expiryDate?todayISO():todayISO(),createdAt:new Date().toISOString()});
        saveState(); closeModal(); render(); showToast(`${p.contentName}માં ${fmtQty(qty)} units Stock IN થયા.`); return;
      }
      if (type==='stock-out') {
        const p=productById(data.productId), lot=state.stockEntries.find(e=>e.id===data.lotId), qty=Number(data.qty);
        if (!p || !lot || lot.productId!==p.id || !(qty>0)) { showToast('Product, batch અને quantity ચકાસો.',true); return; }
        const expiryDaysLeft=daysUntil(lot.expiryDate), balance=lotBalance(lot);
        if (expiryDaysLeft!==null && expiryDaysLeft<0) { showToast('Expired batchમાંથી Stock OUT કરી શકાતો નથી.',true); return; }
        if (qty>balance) { showToast(`આ batchમાં ફક્ત ${fmtQty(balance)} units ઉપલબ્ધ છે.`,true); return; }
        const patient=patientById(data.patientId);
        if (!patient) { showToast('Patient પસંદ કરો.',true); return; }
        state.stockOuts.push({id:uid(),productId:p.id,lotId:lot.id,patientId:patient.id,qty,date:data.date||todayISO(),createdAt:new Date().toISOString()});
        saveState(); closeModal(); render(); showToast(`${fmtQty(qty)} units ${patient.name}ને issue થયા.`); return;
      }
    }

    function deletePatient(id) {
      const p=patientById(id); if (!p) return;

      state.patients=state.patients.filter(x=>x.id!==id); saveState(); render(); showToast('Patient delete થયો.');
    }

    // Minimal OOXML .xlsx writer: writes standard, uncompressed ZIP entries for dependency-free Excel export.
    function xmlEsc(v) { return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
    function colName(n) { let s=''; while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s; }
    function makeSheetXml(rows) {
      const parts=['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>','<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'];
      rows.forEach((row,ri)=>{ parts.push(`<row r="${ri+1}">`); row.forEach((val,ci)=>{ if (val===null || val===undefined || val==='') return; const ref=colName(ci+1)+(ri+1); if (typeof val==='number' && Number.isFinite(val)) parts.push(`<c r="${ref}"><v>${val}</v></c>`); else parts.push(`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`); }); parts.push('</row>'); });
      parts.push('</sheetData></worksheet>'); return parts.join('');
    }
    const CRC_TABLE = (()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
    function crc32(bytes) { let c=0xffffffff; for(const b of bytes)c=CRC_TABLE[(c^b)&255]^(c>>>8); return (c^0xffffffff)>>>0; }
    function makeZip(files) {
      const enc=new TextEncoder(), local=[], central=[]; let offset=0;
      for(const file of files){

        else throw new Error('માત્ર .xlsx અને .csv files supported છે.');
        openImportPreview(parseImportData(sheets),file.name);
      } catch(err) { showToast(err?.message || 'Import કરતી વખતે error આવ્યો.',true); }
    }

    document.addEventListener('click', event => {
      const nav=event.target.closest('.nav-link[data-page]'); if(nav){setPage(nav.dataset.page);return;}
      const actionEl=event.target.closest('[data-action]'); if(!actionEl)return;
      const action=actionEl.dataset.action;
      if(action==='backdrop-close' && event.target===actionEl){closeModal();return;}
      if(action==='close-modal'){closeModal();return;}
      if(action==='add-product'){openProductModal();return;}
      if(action==='edit-product'){openProductModal(actionEl.dataset.id);return;}
      if(action==='delete-product'){deleteProduct(actionEl.dataset.id);return;}
      if(action==='add-patient'){openPatientModal();return;}
      if(action==='edit-patient'){openPatientModal(actionEl.dataset.id);return;}
      if(action==='delete-patient'){deletePatient(actionEl.dataset.id);return;}
      if(action==='add-stock-in'){openStockInModal();return;}
      if(action==='add-stock-out'){openStockOutModal();return;}
      if(action==='delete-entry'){deleteEntry(actionEl.dataset.id);return;}
      if(action==='delete-out'){deleteOut(actionEl.dataset.id);return;}
      if(action==='go-alerts'){setPage('alerts');return;}
      if(action==='go-products'){setPage('products');return;}
      if(action==='go-stock-in'){setPage('stockIn');return;}
      if(action==='import-merge'){commitImport('merge');return;}
      if(action==='import-replace'){commitImport('replace');return;}
    });
    document.addEventListener('submit',onFormSubmit);
    document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
    document.getElementById('exportBtn').addEventListener('click',()=>exportWorkbook(false));
    document.getElementById('templateBtn').addEventListener('click',()=>exportWorkbook(true));
    document.getElementById('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';await handleFile(file);});
    document.getElementById('globalSearch').addEventListener('input',()=>{
      const body=document.getElementById('pageBody');
      body.innerHTML=activePage==='products'?renderProducts():activePage==='stockIn'?renderStockIn():activePage==='stockOut'?renderStockOut():activePage==='patients'?renderPatients():activePage==='alerts'?renderAlerts():renderDashboard();
    });
    document.getElementById('pageActions').addEventListener('change',e=>{if(e.target.id==='expiryDaysInput'){const value=Math.min(365,Math.max(0,Number(e.target.value)||0));state.preferences.expiryDays=value;saveState();render();showToast(`Expiry alert window ${value} દિવસ કરી.`);}});
    document.getElementById('menuBtn').addEventListener('click',()=>{const sidebar=document.getElementById('sidebar');const open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);document.getElementById('sidebarScrim').style.display=open?'block':'none';});
    document.getElementById('sidebarScrim').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarScrim').style.display='none';});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

    render();
  })();
  </script>
</body>
</html>
